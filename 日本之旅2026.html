<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f1a;
  --surface:#1a1a2e;
  --surface2:#16213e;
  --primary:#e63946;
  --accent:#f4a261;
  --gold:#d4af37;
  --text:#eaeaea;
  --text2:#a0a0b8;
  --card-bg:#1e1e36;
  --card-border:#2a2a4a;
  --success:#2ecc71;
  --info:#3498db;
  --day-height:calc(100vh - 120px);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;width:100vw;position:fixed}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* Header */
.header{
  flex-shrink:0;
  padding:12px 16px 8px;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  border-bottom:1px solid var(--card-border);
  position:relative;z-index:10
}
.header-top{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700;letter-spacing:1px}
.header h1 span{color:var(--accent)}
.header .date-range{font-size:11px;color:var(--text2);margin-top:2px}
.header .trip-progress{font-size:11px;color:var(--accent);background:rgba(244,162,97,0.12);padding:2px 10px;border-radius:12px;}
.badge{display:inline-block;background:var(--primary);color:#fff;font-size:10px;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}

/* Tabs */
.tabs{
  flex-shrink:0;
  display:flex;
  overflow-x:auto;
  gap:0;
  padding:0 8px;
  background:var(--surface);
  border-bottom:1px solid var(--card-border);
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;
  padding:10px 14px;
  font-size:12px;
  color:var(--text2);
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all 0.2s;
  white-space:nowrap;
  position:relative;
  user-select:none;
}
.tab .day-num{font-weight:600;font-size:13px;display:block;text-align:center}
.tab .day-date{font-size:9px;opacity:0.7;display:block;text-align:center;margin-top:1px}
.tab .tab-emoji{font-size:14px;display:block;text-align:center}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.active .day-num{color:#fff}
.tab:active{opacity:0.7}

/* Content area */
.content-wrapper{
  flex:1;
  overflow:hidden;
  position:relative;
}
.content-slider{
  display:flex;
  height:100%;
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
  will-change:transform;
}
.day-page{
  flex-shrink:0;
  width:100%;
  height:100%;
  overflow-y:auto;
  padding:12px 16px 80px;
  -webkit-overflow-scrolling:touch;
}
.day-page::-webkit-scrollbar{width:3px}
.day-page::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:3px}

/* Day header */
.day-header{margin-bottom:14px}
.day-header .day-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.day-header .day-title .emoji{font-size:24px}
.day-header .day-sub{font-size:12px;color:var(--text2);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.day-header .day-sub span{display:inline-flex;align-items:center;gap:4px}
.day-header .day-sub .icon{font-size:12px}

/* Timeline */
.timeline{position:relative;padding-left:20px}
.timeline::before{
  content:'';
  position:absolute;left:6px;top:6px;bottom:6px;
  width:2px;background:var(--card-border);
}

.timeline-item{
  position:relative;
  padding:0 0 16px 14px;
  border-left:2px solid transparent;
}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{
  content:'';
  position:absolute;
  left:-17px;top:6px;
  width:10px;height:10px;
  border-radius:50%;
  background:var(--card-border);
  border:2px solid var(--bg);
  z-index:1;
}
.timeline-item.highlight::before{background:var(--accent);border-color:var(--accent)}
.timeline-item.primary::before{background:var(--primary);border-color:var(--primary)}
.timeline-item.success::before{background:var(--success);border-color:var(--success)}
.timeline-item.info::before{background:var(--info);border-color:var(--info)}

.item-time{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px}
.item-activity{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:2px}
.item-activity .emoji{font-size:16px;margin-right:4px}
.item-detail{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:3px}
.item-transport{
  font-size:11px;color:var(--info);
  background:rgba(52,152,219,0.08);
  padding:2px 8px;border-radius:4px;
  display:inline-block;margin-top:2px;
}
.item-cost{
  font-size:11px;color:var(--success);
  background:rgba(46,204,113,0.08);
  padding:2px 8px;border-radius:4px;
  display:inline-block;margin-top:2px;margin-left:4px;
}
.item-tip{
  font-size:11px;color:var(--gold);
  background:rgba(212,175,55,0.08);
  padding:4px 8px;border-radius:6px;
  margin-top:4px;line-height:1.5;
}

/* Info card */
.info-card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:10px;
  padding:12px;
  margin:12px 0 16px;
}
.info-card .info-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.info-card .info-row{font-size:12px;color:var(--text2);padding:3px 0;display:flex;justify-content:space-between}
.info-card .info-row .label{color:var(--text2)}
.info-card .info-row .value{color:var(--text);font-weight:500}

/* Day summary card */
.day-summary{
  background:var(--surface2);
  border-radius:10px;
  padding:10px 12px;
  margin-top:16px;
  display:flex;flex-wrap:wrap;gap:6px;
}
.day-summary .tag{
  font-size:10px;
  padding:3px 10px;
  border-radius:12px;
  background:var(--card-bg);
  color:var(--text2);
  display:inline-flex;align-items:center;gap:4px;
}
.day-summary .tag.transport{background:rgba(52,152,219,0.12);color:var(--info)}
.day-summary .tag.cost{background:rgba(46,204,113,0.12);color:var(--success)}
.day-summary .tag.hotel{background:rgba(244,162,97,0.12);color:var(--accent)}
.day-summary .tag.warn{background:rgba(230,57,70,0.12);color:var(--primary)}

/* Bottom nav */
.bottom-nav{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px;
  background:var(--surface);
  border-top:1px solid var(--card-border);
  z-index:10;
}
.nav-btn{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  color:var(--text);
  padding:8px 16px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
  display:flex;align-items:center;gap:4px;
  transition:all 0.2s;
  user-select:none;
}
.nav-btn:active{transform:scale(0.95);opacity:0.7}
.nav-btn:disabled{opacity:0.3;pointer-events:none}
.nav-btn .arr{font-size:14px}
.nav-info{font-size:11px;color:var(--text2);text-align:center}
.nav-info strong{color:var(--accent);font-weight:600}

/* Install banner */
.install-banner{
  position:fixed;bottom:60px;left:0;right:0;
  background:linear-gradient(135deg,#2a1a3e,#1a2a4e);
  padding:10px 16px;
  display:none;
  align-items:center;justify-content:space-between;
  z-index:20;
  border-top:1px solid var(--card-border);
  animation:fadeInUp 0.3s ease;
}
.install-banner.show{display:flex}
.install-banner .text{font-size:12px;flex:1}
.install-banner .btn{
  background:var(--primary);
  color:#fff;border:none;
  padding:6px 14px;border-radius:6px;
  font-size:12px;cursor:pointer;
  margin-left:8px;
}
.install-banner .close{
  background:none;border:none;
  color:var(--text2);font-size:18px;
  cursor:pointer;margin-left:6px;
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Schedule note (hotel/transport summary) */
.schedule-note{
  background:linear-gradient(135deg,rgba(244,162,97,0.06),rgba(230,57,70,0.06));
  border:1px solid rgba(244,162,97,0.15);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:12px;
  font-size:12px;line-height:1.6;
  color:var(--text2);
}
.schedule-note strong{color:var(--text)}
.schedule-note .hl{color:var(--accent)}

/* Splash screen */
.splash{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
  transition:opacity 0.5s ease;
}
.splash.hide{opacity:0;pointer-events:none}
.splash .logo{font-size:48px;margin-bottom:16px;animation:pulse 2s infinite}
.splash h2{font-size:22px;color:var(--accent);margin-bottom:4px}
.splash p{font-size:13px;color:var(--text2)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* Loading dots */
.splash .dots{margin-top:20px;display:flex;gap:6px}
.splash .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  animation:dotPulse 1.4s infinite ease-in-out both;
}
.splash .dot:nth-child(1){animation-delay:-0.32s}
.splash .dot:nth-child(2){animation-delay:-0.16s}
.splash .dot:nth-child(3){animation-delay:0s}
@keyframes dotPulse{0%,80%,100%{transform:scale(0.5)}40%{transform:scale(1)}}

/* Toast */
.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:var(--surface2);
  border:1px solid var(--card-border);
  color:var(--text);
  padding:8px 16px;
  border-radius:8px;
  font-size:12px;
  z-index:50;
  opacity:0;
  transition:opacity 0.3s;
  pointer-events:none;
  white-space:nowrap;
}
.toast.show{opacity:1}

/* Responsive - landscape tablets */
@media(min-width:768px){
  .day-page{padding:20px 32px 80px;max-width:700px;margin:0 auto}
  .tabs{padding:0 16px;justify-content:center}
  .header{padding:16px 32px}
}

/* Dark mode refinements */
@media(prefers-color-scheme:light){
  :root{
    --bg:#f5f5f5;
    --surface:#ffffff;
    --surface2:#f0f0f5;
    --text:#1a1a2e;
    --text2:#6c6c80;
    --card-bg:#ffffff;
    --card-border:#e0e0e8;
  }
  .header{background:linear-gradient(135deg,#1a1a2e 0%,#2a2a4e 100%)}
  .header h1,.header .date-range{color:#fff}
  .header .trip-progress{color:var(--accent)}
}

/* Swipe indicator */
.swipe-indicator{
  text-align:center;font-size:10px;color:var(--text2);
  padding:4px 0 0;opacity:0.5;
}
</style>
</head>

// ====== STATE ======
let currentDay = 0;
let deferredPrompt = null;

// ====== RENDER ======
function render(){
  renderTabs();
  renderDays();
  goToDay(currentDay);
  updateNav();
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = DAYS.map((d,i)=>{
    const active = i === currentDay ? 'active' : '';
    return `<div class="tab ${active}" data-idx="${i}" onclick="goToDay(${i})">
      <span class="tab-emoji">${d.emoji}</span>
      <span class="day-num">Day ${d.day}</span>
      <span class="day-date">${d.date}</span>
    </div>`;
  }).join('');
}

function renderDays(){
  const slider = document.getElementById('contentSlider');
  slider.innerHTML = DAYS.map((d)=>{
    const items = d.items.map((it,idx)=>{
      const cls = it.highlight ? 'highlight' : '';
      const transport = it.transport ? `<span class="item-transport">🚃 ${it.transport}</span>` : '';
      const cost = it.cost ? `<span class="item-cost">💰 ${it.cost}</span>` : '';
      return `<div class="timeline-item ${cls}">
        ${it.time ? `<div class="item-time">${it.time}</div>` : ''}
        <div class="item-activity">${it.activity}</div>
        ${it.detail ? `<div class="item-detail">${it.detail}</div>` : ''}
        <div>${transport}${cost}</div>
      </div>`;
    }).join('');

    const summaryTags = [];
    if(d.summary.transport) summaryTags.push(`<span class="tag transport">🚃 ${d.summary.transport}</span>`);
    if(d.summary.hotel) summaryTags.push(`<span class="tag hotel">🏨 ${d.summary.hotel}</span>`);
    const sumHTML = summaryTags.length ? `<div class="day-summary">${summaryTags.join('')}</div>` : '';

    return `<div class="day-page">
      <div class="day-header">
        <div class="day-title"><span class="emoji">${d.emoji}</span> Day ${d.day} · ${d.date}（${d.weekday}）</div>
        <div class="day-title" style="font-size:16px;margin-top:2px">${d.title}</div>
        <div class="day-sub">
          <span>📍 ${d.location}</span>
        </div>
      </div>
      ${d.note ? `<div class="schedule-note">💡 ${d.note.replace(/\n/g,'<br>')}</div>` : ''}
      <div class="timeline">${items}</div>
      ${sumHTML}
    </div>`;
  }).join('');
}

function goToDay(idx){
  if(idx < 0 || idx >= DAYS.length) return;
  currentDay = idx;
  const slider = document.getElementById('contentSlider');
  slider.style.transform = `translateX(-${idx * 100}%)`;
  document.getElementById('dayProgress').textContent = `Day ${idx+1} / 12 · ${DAYS[idx].title}`;

  // Update tabs
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', i === idx);
    if(i === idx) t.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  });
  updateNav();
}

function updateNav(){
  document.getElementById('prevBtn').disabled = currentDay === 0;
  document.getElementById('nextBtn').disabled = currentDay === DAYS.length - 1;
  document.querySelector('#navInfo strong').textContent = `Day ${currentDay+1}`;
}

// ====== SWIPE ======
const wrapper = document.getElementById('contentWrapper');
let touchStartX = 0, touchEndX = 0;
wrapper.addEventListener('touchstart',e=>{touchStartX = e.changedTouches[0].screenX}, {passive:true});
wrapper.addEventListener('touchend',e=>{
  touchEndX = e.changedTouches[0].screenX;
  const diff = touchStartX - touchEndX;
  if(Math.abs(diff) > 40){
    if(diff > 0 && currentDay < DAYS.length - 1) goToDay(currentDay + 1);
    else if(diff < 0 && currentDay > 0) goToDay(currentDay - 1);
  }
}, {passive:true});

// ====== NAV ======
document.getElementById('prevBtn').addEventListener('click',()=>goToDay(currentDay-1));
document.getElementById('nextBtn').addEventListener('click',()=>goToDay(currentDay+1));

// Keyboard nav
document.addEventListener('keydown',e=>{
  if(e.key === 'ArrowLeft' && currentDay > 0) goToDay(currentDay-1);
  if(e.key === 'ArrowRight' && currentDay < DAYS.length-1) goToDay(currentDay+1);
});

// ====== INSTALL PWA ======
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

document.getElementById('installBtn').addEventListener('click',async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    if(result.outcome === 'accepted') document.getElementById('installBanner').classList.remove('show');
    deferredPrompt = null;
  } else {
    showToast('📲 iOS：用Safari打开→分享按钮→添加到主屏幕');
  }
});
document.getElementById('installClose').addEventListener('click',()=>{
  document.getElementById('installBanner').classList.remove('show');
});

// Show install hint on iOS
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if(isIOS && !window.matchMedia('(display-mode: standalone)').matches){
  // Show later after splash
  setTimeout(()=>{
    document.getElementById('installBanner').classList.add('show');
    document.querySelector('#installBanner .text').textContent = '📲 用Safari打开→分享→添加到主屏幕';
  }, 2000);
}

// ====== TOAST ======
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ====== SPLASH ======
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
  }, 800);
});

// ====== INIT ======
document.addEventListener('DOMContentLoaded',render);

// ====== SERVICE WORKER (for offline standalone app) ======
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
